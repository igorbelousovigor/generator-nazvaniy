<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Случайные названия для вполне серьёзных проектов благоустройства." />
    <meta name="theme-color" content="#f2f0e8" />
    <title>Генератор названий благоустройства</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" id="generator">
        <div class="hero-copy">
          <h1>Генератор названия<br />проекта<br />благоустройства</h1>
        </div>

        <div class="reels" aria-label="Сгенерированное название">
          <section class="reel" id="noun-reel" aria-label="Существительное">
            <div class="reel-topline"><span class="reel-mark">✳</span></div>
            <div class="reel-window" aria-live="polite" aria-atomic="true">
              <span class="ghost-word before">путь</span>
              <strong class="active-word">река</strong>
              <span class="ghost-word after">история</span>
            </div>
            <div class="reel-line"></div>
          </section>

          <section class="reel" id="addition-reel" aria-label="Дополнение">
            <div class="reel-topline"><span class="reel-mark">✳</span></div>
            <div class="reel-window" aria-live="polite" aria-atomic="true">
              <span class="ghost-word before">памяти</span>
              <strong class="active-word">времени</strong>
              <span class="ghost-word after">истории</span>
            </div>
            <div class="reel-line"></div>
          </section>
        </div>

        <div class="action-row">
          <p class="result" aria-live="polite">
            <span>готовое название</span>
            <strong id="result">река времени</strong>
          </p>
          <button class="generate-button" id="generate" type="button">
            <span>сгенерировать название</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>

      <footer>
        <span>Нажмите пробел, если лень тянуться к кнопке</span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
