<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Случайные названия для вполне серьёзных проектов благоустройства." />
    <meta name="theme-color" content="#ffffff" />
    <title>Генератор названий благоустройства</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" />
    <link rel="stylesheet" href="styles.css?v=16" />
  </head>
  <body>
    <main>
      <section class="hero" id="generator">
        <div class="hero-copy">
          <h1>Как назвать проект<br />общественного<br />пространства</h1>
        </div>

        <div class="reels" aria-label="Сгенерированное название">
          <section class="reel" id="noun-reel" aria-label="Существительное">
            <div class="reel-topline"><span class="reel-mark">✳</span></div>
            <div class="reel-window" aria-live="polite" aria-atomic="true">
              <span class="ghost-word before">колыбель</span>
              <strong class="active-word">связь</strong>
              <span class="ghost-word after">горизонт</span>
            </div>
            <div class="reel-line"></div>
          </section>

          <section class="reel" id="addition-reel" aria-label="Дополнение">
            <div class="reel-topline"><span class="reel-mark">✳</span></div>
            <div class="reel-window" aria-live="polite" aria-atomic="true">
              <span class="ghost-word before">отдыха</span>
              <strong class="active-word">времён</strong>
              <span class="ghost-word after">дружбы</span>
            </div>
            <div class="reel-line"></div>
          </section>
        </div>

        <div class="action-row">
          <div class="result-wrap">
            <p class="result" aria-live="polite">
              <span>готовое название</span>
              <strong id="result">связь времён</strong>
            </p>
            <button class="copy-button" id="copy" type="button" aria-label="Копировать название" title="Копировать название">
              <span class="copy-icon" aria-hidden="true"></span>
              <span class="copy-status">копировать</span>
            </button>
          </div>
          <div class="generate-wrap">
            <button class="generate-button" id="generate" type="button">
              <span>сгенерировать название</span>
              <span class="button-arrow" aria-hidden="true">↗</span>
            </button>
            <div class="author-credit">
              тгк автора:&nbsp;<a href="https://t.me/urbanbip" target="_blank" rel="noopener noreferrer">бип (игорь белоусов)</a>
            </div>
          </div>
        </div>
      </section>

      <footer>
        <span>Нажмите пробел, если лень тянуться к кнопке</span>
      </footer>
    </main>
    <script src="script.js?v=16"></script>
  </body>
</html>
